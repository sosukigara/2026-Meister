[versions]
agp = "8.5.2"
kotlin = "1.9.24"
core-ktx = "1.13.1"
appcompat = "1.7.0"
activity-ktx = "1.9.3"
lifecycle = "2.8.6"
camerax = "1.3.4"
# Google Maven (https://dl.google.com/android/maven2/com/google/mediapipe/group-index.xml) で確認。2026-11-11 時点の最新安定版。
tasks-vision = "1.2.2"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity-ktx" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "tasks-vision" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
