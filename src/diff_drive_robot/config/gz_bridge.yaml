# bridge.yaml
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# /joint_states bridge removed — Gazebo publishes model poses at 1000 Hz and
# timestamps occasionally jitter backward, triggering robot_state_publisher's
# "Moved backwards in time" republish loop that destabilises the entire TF
# tree.  All robot joints are fixed so RSP does not need live joint states.
# - ros_topic_name: "/joint_states"
#   gz_topic_name: "/joint_states"
#   ros_type_name: "sensor_msgs/msg/JointState"
#   gz_type_name: "gz.msgs.Model"
#   direction: GZ_TO_ROS

- ros_topic_name: "/odom"
  gz_topic_name: "/model/diff_drive_robot/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# cmd_vel_safe is the collision-monitor-filtered output — the only path to the robot.
# Chain: controller → cmd_vel → velocity_smoother → cmd_vel_smoothed
#        → collision_monitor(relay) → cmd_vel_safe → Gazebo
- ros_topic_name: "/cmd_vel_safe"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Raw lidar straight from Gazebo. scan_to_scan_filter_chain (laser_filters,
# see config/laser_filters.yaml) consumes this and republishes the cleaned
# result on /scan, which is what AMCL, SLAM Toolbox, and the Nav2 costmaps
# actually subscribe to.
- ros_topic_name: "/scan_raw"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# /tf bridge removed — Gazebo Pose_V duplicates child frames already published by
# robot_state_publisher (/tf_static), causing TF2 "detected jump back in time"
# buffer clears that prevent all transform lookups.
# odom→base_link is now published by odom_tf_broadcaster from /odom messages.

# 3D LiDAR PointCloud2 (only active when lidar3d.xacro is used)
- ros_topic_name: "/points"
  gz_topic_name: "/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# RGB camera (camera.xacro)
- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS