slam_toolbox:
  ros__parameters:
    # Frames
    odom_frame: "odom"
    base_frame: "base_link"
    map_frame: "map"
    scan_topic: "/scan"

    # Mode
    mode: "mapping"

    # Map configuration
    resolution: 0.05
    map_update_interval: 5.0
    map_save_interval: 60
    publish_map: true
    map_topic: "/map"

    # Laser configuration (2D LiDAR optimized)
    laser_min_range: 0.12
    laser_max_range: 12.0
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    minimum_travel_distance: 0.25
    minimum_travel_heading: 0.5

    # Loop closure
    loop_closure: true
    loop_search_max_distance: 4.0
    loop_match_min_chain_size: 10
    loop_match_max_variance_coarse: 0.5
    loop_match_max_variance_fine: 0.1

    # Correlation parameters
    correlation_resolution: 0.05
    correlation_smear_deviation: 0.1
    scan_max_distance: 12.0

    # Transform
    transform_tolerance: 0.2
    use_sim_time: true
