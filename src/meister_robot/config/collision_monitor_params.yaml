collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0

    # Polygons define safety zones around the robot
    polygons: ["StopZone", "SlowdownZone", "FootprintApproach"]

    # Immediate stop zone (tight around robot)
    StopZone:
      type: "polygon"
      action_type: "stop"
      polygon: [[-0.30, -0.30], [-0.30, 0.30], [0.30, 0.30], [0.30, -0.30]]
      min_points: 4
      visualize: True
      enabled: True

    # Slowdown zone (wider, triggers speed reduction)
    SlowdownZone:
      type: "polygon"
      action_type: "slowdown"
      polygon: [[-0.50, -0.50], [-0.50, 0.50], [0.50, 0.50], [0.50, -0.50]]
      min_points: 4
      slowdown_ratio: 0.3
      visualize: True
      enabled: True

    # Approach zone (from footprint)
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True

    # Observation sources
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True
