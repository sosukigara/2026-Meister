; ============================================================================
; platformio.ini — Meister ESP32 ファームウェア
;
; 環境:
;   esp32dev — 実機用ファームウェア（ESP32 Arduino framework）
;   native   — ホスト側でプロトコル層のユニットテスト（Unity）
;
; プロトコルの詳細は include/meister_protocol.h と README.md を参照。
; ピン配置・ボーレートは下記の MSTE_* マクロで変更できる。
; ============================================================================

[platformio]
default_envs = esp32dev

[common]
build_flags =
    ; ---- UART（PC ⇔ ESP32 プロトコル通信、デフォルト: Serial2 = GPIO16/17）----
    -DMSTE_UART_BAUD=115200
    -DMSTE_UART_RX_PIN=16
    -DMSTE_UART_TX_PIN=17
    ; ---- 駆動モータ PWM ピン（6ch）----
    -DMSTE_MOTOR_PIN0=25
    -DMSTE_MOTOR_PIN1=26
    -DMSTE_MOTOR_PIN2=27
    -DMSTE_MOTOR_PIN3=14
    -DMSTE_MOTOR_PIN4=13
    -DMSTE_MOTOR_PIN5=2
    ; ---- 駆動モータ 方向ピン（6ch、-1 = 未接続 → PWM のみ）----
    -DMSTE_MOTOR_DIR0=-1
    -DMSTE_MOTOR_DIR1=-1
    -DMSTE_MOTOR_DIR2=-1
    -DMSTE_MOTOR_DIR3=-1
    -DMSTE_MOTOR_DIR4=-1
    -DMSTE_MOTOR_DIR5=-1
    ; ---- ステアリングサーボ PWM ピン（6ch）----
    -DMSTE_STEER_PIN0=4
    -DMSTE_STEER_PIN1=5
    -DMSTE_STEER_PIN2=15
    -DMSTE_STEER_PIN3=18
    -DMSTE_STEER_PIN4=19
    -DMSTE_STEER_PIN5=21
    ; ---- アームサーボ PWM ピン（4ch）----
    -DMSTE_ARM_PIN0=22
    -DMSTE_ARM_PIN1=23
    -DMSTE_ARM_PIN2=32
    -DMSTE_ARM_PIN3=33
    ; ---- グリッパーサーボ PWM ピン（1ch）----
    ; ※ GPIO12 はストラップピン。実機配線時に変更推奨。
    -DMSTE_GRIPPER_PIN=12
    ; ---- PWM パラメータ ----
    ; -DMSTE_SERVO_DRIVER_DEBUG   # サーボをデバッグコンソール出力に切替（ハード未接続時）
    ; -DMSTE_MOTOR_PWM_FREQ=1000  # モータ PWM 周波数 [Hz]
    ; -DMSTE_PWM_RESOLUTION=8     # モータ PWM 分解能 [bit]

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = ${common.build_flags}

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_flags = ${common.build_flags}
