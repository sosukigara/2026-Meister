; MKS ESP32 FOC V2.0, two channels per board, three axle roles.
;
; One source, three binaries. The role is baked in at compile time (FOC_ROLE_*) and is
; reported as #ROLE at boot, so a swapped cable is visible before anything spins.
;
; Upload: fill the by-path of each board once, then keep it. The three boards are
; identical, so /dev/ttyUSB0..2 can reorder across replug. Flash one board at a time the
; first time and record its /dev/serial/by-path path here.
;
; Do not put upload_port in [common]: three boards need three different paths.

[platformio]
default_envs = foc_front

[common]
build_flags = -I include

[env:foc_front]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    askuric/Simple FOC@2.2.1
build_flags = ${common.build_flags} -DFOC_ROLE_FRONT=1
; upload_port = /dev/serial/by-path/REPLACE_FRONT
; monitor_port = /dev/serial/by-path/REPLACE_FRONT

[env:foc_mid]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    askuric/Simple FOC@2.2.1
build_flags = ${common.build_flags} -DFOC_ROLE_MID=1
; upload_port = /dev/serial/by-path/REPLACE_MID
; monitor_port = /dev/serial/by-path/REPLACE_MID

[env:foc_rear]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    askuric/Simple FOC@2.2.1
build_flags = ${common.build_flags} -DFOC_ROLE_REAR=1
; upload_port = /dev/serial/by-path/REPLACE_REAR
; monitor_port = /dev/serial/by-path/REPLACE_REAR

[env:native]
platform = native
test_framework = unity
build_flags = -I include
; test_build_src is off by default, which would leave foc_protocol.cpp out of the link.
test_build_src = true
; Only the Arduino-free translation unit goes into the test link. Without this filter the
; whole src/ would be compiled and SimpleFOC plus the ESP32 HAL would be dragged in.
build_src_filter = +<foc_protocol.cpp>
