[platformio]
default_envs = foc_test_m1

[env:foc_test_m1]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    askuric/Simple FOC@2.2.1
; Bench-only spin test for one LA8308 KV90 on M1. Never flashed to production.
; upload_port is intentionally left unset: pass --upload-port explicitly
; (per AGENTS.md R6, by-id naming prevents misflashing).
