; M5Stack Tab5 の BMI270 6軸を PC へ送信するファームウェア。
; 設定値（周期・スケール）は include/imu_config.h が唯一の出所。

[platformio]
default_envs = m5stack-tab5-p4

[env:m5stack-tab5-p4]
platform = espressif32
board = m5stack-tab5-p4
framework = arduino
; この環境の旧 arduino-esp32 2.x パッケージが解決されず FRAMEWORK_DIR が
; None になるため、ボード要求の 3.3.9 を明示する。
platform_packages =
    framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.2.23
    m5stack/M5GFX@^0.2.30
build_flags =
    -std=gnu++17
; 実機の port は ★要確認★（環境により /dev/ttyACM* が変わる）。
; 誤書き込み防止のため、接続確認後に by-id で指定すること。
; upload_port = /dev/serial/by-id/...

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_flags =
    -std=gnu++17
build_src_filter =
    +<*>
    -<main.cpp>
    -<imu_view.cpp>
